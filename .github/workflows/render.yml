name: render-carousels

on:
  push:
    branches: [main]
    paths:
      - 'runs/*/carousel.json'
      - 'templates/**'
      - 'src/**'
      - 'brand.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          npm run setup

      # Renderuje kazdy przebieg, ktory nie ma jeszcze znacznika DONE. Gdy kontrola jakosci (qa) nie przejdzie,
      # media tego przebiegu nie trafiaja do repo (nie da sie ich opublikowac), ale pozostale przebiegi sa dalej renderowane.
      # Log kazdego przebiegu (render + qa) laduje w reports/<id>.log, a przy bledzie takze podglad reports/<id>-contact.jpg.
      - name: Render runs without media
        run: |
          mkdir -p reports
          : > failed.txt
          for d in runs/*/; do
            id=$(basename "$d")
            [ -f "runs/$id/carousel.json" ] || continue
            if [ -f "media/$id/DONE" ]; then continue; fi
            if node src/render.mjs "$id" > "reports/$id.log" 2>&1 && node src/qa.mjs "$id" >> "reports/$id.log" 2>&1; then
              mkdir -p "media/$id"
              cp runs/$id/out/slide-* "media/$id/"
              cp runs/$id/out/contact.jpg "media/$id/contact.jpg"
              date -u +%FT%TZ > "media/$id/DONE"
              echo "RESULT: OK" >> "reports/$id.log"
            else
              echo "RESULT: FAILED" >> "reports/$id.log"
              cp runs/$id/out/contact.jpg "reports/$id-contact.jpg" 2>/dev/null || true
              echo "$id" >> failed.txt
            fi
          done

      - name: Commit media
        if: always()
        run: |
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git add media reports
          git diff --cached --quiet || git commit -m "Render mediow"
          git pull --rebase origin main
          git push

      - name: Fail when any run failed
        run: |
          if [ -s failed.txt ]; then echo "Bledy QA:"; cat failed.txt; exit 1; fi
